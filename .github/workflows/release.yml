name: Release

# Ein Tag wie v1.0.0 baut die Windows-Installer und hängt sie an einen
# GitHub-Release. Dadurch muss niemand die App selbst kompilieren.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Build Windows installers
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and package
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts to the workflow run
        uses: actions/upload-artifact@v4
        with:
          name: berichtsheft-windows
          path: |
            release/*.exe
            release/*.blockmap
          if-no-files-found: error

      - name: Attach installers to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
          draft: false
          generate_release_notes: true
